name: Build Android APK (Poseidon)

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilazione APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Scarica il codice dal repository
        uses: actions/checkout@v4

      - name: 2. Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Configura Java (richiesto da Android)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 4. Installa le dipendenze web
        run: npm install

      - name: 5. Sincronizza Capacitor
        run: |
          chmod +x node_modules/.bin/cap
          npx cap sync android

      - name: 6. Sblocca i permessi di compilazione
        run: chmod +x android/gradlew

      - name: 7. Genera l'APK (Versione Rilascio)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: 7.5 Installa strumenti Android richiesti per la firma
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"

      - name: 8. Firma digitale dell'APK
        uses: r0adkll/sign-android-release@dbeba6b98a60b0fd540c02443c7f428cdedf0e7f
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: poseidon
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: 9. Carica l'APK firmato ufficiale
        uses: actions/upload-artifact@v4
        with:
          name: Poseidon-APK-Ufficiale
          path: ${{steps.sign_app.outputs.signedReleaseFile}}