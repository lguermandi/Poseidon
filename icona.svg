<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sfumatura per lo sfondo (Dark Slate) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Sfumatura per il tridente (Argento/Bianco) -->
    <linearGradient id="trident-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>
  
  <!-- Base dell'icona con angoli smussati (Stile iOS/Android) -->
  <rect width="512" height="512" rx="115" fill="url(#bg-grad)"/>
  
  <!-- Onde (Stato del mare) -->
  <path d="M 80 370 Q 168 310 256 370 T 432 370" fill="none" stroke="#0ea5e9" stroke-width="28" stroke-linecap="round"/>
  <path d="M 80 430 Q 168 370 256 430 T 432 430" fill="none" stroke="#38bdf8" stroke-width="28" stroke-linecap="round"/>

  <!-- Tridente (Poseidon) -->
  <!-- Asta centrale -->
  <line x1="256" y1="120" x2="256" y2="390" stroke="url(#trident-grad)" stroke-width="32" stroke-linecap="round"/>
  <polygon points="256,60 220,130 292,130" fill="#f8fafc" />
  
  <!-- Braccia laterali -->
  <path d="M 140 180 V 250 C 140 330 372 330 372 250 V 180" fill="none" stroke="url(#trident-grad)" stroke-width="32" stroke-linecap="round"/>
  <polygon points="140,120 110,190 170,190" fill="#f8fafc" />
  <polygon points="372,120 342,190 402,190" fill="#f8fafc" />
  
  <!-- Cuore Sentinella / Radar GPS -->
  <circle cx="256" cy="256" r="32" fill="#fb923c" />
  <circle cx="256" cy="256" r="14" fill="#0f172a" />
</svg>
