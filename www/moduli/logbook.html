<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .logbook-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 15px; }
        .logbook-table th, .logbook-table td { border: 1px solid #334155; padding: 8px; text-align: center; color: #f8fafc; }
        .logbook-table th { background: #1e293b; color: #38bdf8; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>Giornale di Bordo (Logbook) 📖</h1>
    <div class="subtitle">Registrazione cronologica e dati di rotta in tempo reale</div>

    <!-- Pannello di Controllo / Annotazione -->
    <div class="panel">
        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
            <div class="input-group" style="flex: 1; min-width: 200px;">
                <label>Condizioni Meteo / Stato del Mare</label>
                <input type="text" id="nota-meteo" placeholder="Es. Mare calmo, vento da SE 10 nodi">
            </div>
            <div class="input-group" style="flex: 1; min-width: 200px;">
                <label>Note di Bordo / Attività</label>
                <input type="text" id="nota-testo" placeholder="Es. Virata a sinistra, controllo sentina">
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn-action" style="background: #38bdf8; color: #0f172a; font-weight: bold;" onclick="registraPuntoGPS()">📍 Annota Punto GPS Attuale</button>
            <button class="btn-action" style="background: #ef4444;" onclick="pulisciLogbook()">🗑️ Svuota Registro</button>
        </div>
        <p id="stato-log" style="margin-top: 10px; color: #fb923c; font-size: 0.85rem;"></p>
    </div>

    <!-- Tabella Storico Logbook -->
    <div class="panel" id="pannello-tabella">
        <h3 style="color: #38bdf8; margin-top: 0;">Registro di Navigazione</h3>
        <div style="overflow-x: auto;">
            <table class="logbook-table">
                <thead>
                    <tr>
                        <th>Ora (UTC)</th>
                        <th>Latitudine</th>
                        <th>Longitudine</th>
                        <th>Meteo / Mare</th>
                        <th>Note Equipaggio</th>
                    </tr>
                </thead>
                <tbody id="corpo-logbook">
                    <!-- Le righe verranno inserite dinamicamente qui -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Recupera i log salvati in precedenza nella memoria del browser (localStorage)
        let registroLog = JSON.parse(localStorage.getItem('nave_logbook') || "[]");
        mostraLogbook();

        function registraPuntoGPS() {
            const stato = document.getElementById('stato-log');
            const meteo = document.getElementById('nota-meteo').value || "N/D";
            const testo = document.getElementById('nota-testo').value || "Navigazione regolare";

            if (!navigator.geolocation) {
                stato.textContent = "Errore: GPS non supportato dal dispositivo.";
                return;
            }

            stato.textContent = "Acquisizione posizione satellitare in corso...";

            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude.toFixed(4);
                const lon = position.coords.longitude.toFixed(4);
                const oraEsatta = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });

                // Crea l'oggetto voce di bordo
                const nuovaVoce = {
                    ora: oraEsatta,
                    lat: lat + "° N",
                    lon: lon + "° E",
                    meteo: meteo,
                    testo: testo
                };

                // Aggiunge in cima alla lista e salva in locale
                registroLog.unshift(nuovaVoce);
                localStorage.setItem('nave_logbook', JSON.stringify(registroLog));

                // INVIO AUTOMATICO AL CLOUD (se l'utente è loggato)
                if (window.parent && window.parent.sincronizzaConCloud) {
                    window.parent.sincronizzaConCloud('logbook', registroLog);
                }

                mostraLogbook();
                stato.textContent = "Punto annotato con successo nel Giornale di Bordo!";
                
                // Pulisce i campi di testo
                document.getElementById('nota-meteo').value = "";
                document.getElementById('nota-testo').value = "";

            }, (error) => {
                stato.textContent = "Impossibile rilevare la posizione GPS. Controlla i permessi.";
            }, { enableHighAccuracy: true });
        }

        function mostraLogbook() {
            const tbody = document.getElementById('corpo-logbook');
            if (registroLog.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="color: #94a3b8; padding: 20px;">Nessuna voce registrata in questo logbook.</td></tr>`;
                return;
            }

            let html = "";
            registroLog.forEach(voce => {
                html += `
                    <tr>
                        <td style="font-weight: bold; color: #4ade80;">${voce.ora}</td>
                        <td style="font-family: monospace;">${voce.lat}</td>
                        <td style="font-family: monospace;">${voce.lon}</td>
                        <td>${voce.meteo}</td>
                        <td style="text-align: left; padding-left: 10px;">${voce.testo}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function pulisciLogbook() {
            if (confirm("Vuoi davvero cancellare tutto lo storico del giornale di bordo?")) {
                registroLog = [];
                localStorage.removeItem('nave_logbook');
                mostraLogbook();
                document.getElementById('stato-log').textContent = "Registro svuotato.";
            }
        }
    </script>
</body>
</html>
