<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mappa</title>

    <!-- Librerie esterne -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* RESET TOTALE E ISOLAMENTO */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            background-color: #0f172a;
            font-family: 'Inter', sans-serif;
            /* Rimuoviamo il flexbox del file globale */
            display: block !important;
        }

        /* Il contenitore della mappa DEVE essere fisso e totale */
        #mappa-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* HUD: DIST, SOG, TEMPO (Forzati in Orizzontale) */
        .hud-top {
            position: absolute;
            top: 15px;
            left: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px;
            /* REGOLE PER ORIZZONTALE */
            display: flex !important;
            flex-direction: row !important;
            justify-content: space-around !important;
            align-items: center !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .hud-box {
            flex: 1;
            text-align: center;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hud-box:last-child {
            border-right: none;
        }

        .hud-label {
            display: block;
            color: #94a3b8;
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .hud-value {
            display: block;
            font-size: 1.5rem;
            font-weight: 800;
            font-family: 'Inter', monospace;
        }

        #distanza-totale {
            color: #38bdf8;
        }

        #velocita-attuale {
            color: #4ade80;
        }

        #tempo-trascorso {
            color: #facc15;
        }

        /* PULSANTI FLOTTANTI */
        .fab-container {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .fab-btn {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 1.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            cursor: pointer;
        }

        #btn-center {
            background: #3b82f6;
        }

        #btn-naviga {
            background: #10b981;
        }

        #btn-naviga.active {
            background: #ef4444;
        }

        /* PANNELLO PIANIFICAZIONE (BOTTOM SHEET) */
        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1e293b;
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
            border-radius: 24px 24px 0 0;
            z-index: 2000;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.33, 1, 0.68, 1);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
            color: white;
        }

        .bottom-sheet.open {
            transform: translateY(0);
        }

        .sheet-title {
            font-size: 1.2rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 15px;
        }

        /* Utility per nascondere pianificazione all'avvio */
        #sheet-pianificazione {
            display: block;
        }
    </style>
</head>

<body>

    <!-- IL CONTENITORE DELLA MAPPA -->
    <div id="mappa-container"></div>

    <!-- HUD SUPERIORE -->
    <div class="hud-top">
        <div class="hud-box">
            <span class="hud-label">Dist (Nm)</span>
            <span class="hud-value" id="distanza-totale">0.00</span>
        </div>
        <div class="hud-box">
            <span class="hud-label">SOG (Kn)</span>
            <span class="hud-value" id="velocita-attuale">0.0</span>
        </div>
        <div class="hud-box">
            <span class="hud-label">Tempo</span>
            <span class="hud-value" id="tempo-trascorso">00:00</span>
        </div>
    </div>

    <!-- TASTI AZIONE -->
    <div class="fab-container">
        <button class="fab-btn" id="btn-center" onclick="centraMappa()">
            <i class="ph ph-crosshair"></i>
        </button>
        <button class="fab-btn" id="btn-naviga" onclick="interruttoreNavigazione()">
            <i class="ph ph-play" id="icona-naviga"></i>
        </button>
    </div>

    <!-- CARICAMENTO JS ALLA FINE PER EVITARE "CONTAINER NOT FOUND" -->
    <script src="../js/mappa-module.js"></script>

    <script>
        let uiInNavigazione = false;

        window.impostaUINavigazione = function (attiva) {
            uiInNavigazione = attiva;
            document.getElementById('btn-naviga').classList.toggle('active', attiva);
            document.getElementById('icona-naviga').className = attiva ? 'ph ph-stop' : 'ph ph-play';
        };

        function interruttoreNavigazione() {
            if (!uiInNavigazione) {
                window.impostaUINavigazione(true);
                window.avviaGPS().catch(() => window.impostaUINavigazione(false));
            } else {
                window.impostaUINavigazione(false);
                window.fermaGPS();
                document.getElementById('sheet-salvataggio')?.classList.add('open');
            }
        }

        window.resetUINavigazione = () => window.impostaUINavigazione(false);
    </script>
</body>

</html>
