<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    
    <!-- Librerie CSS e JS di Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        #mappa-container { 
            height: 500px; 
            width: 100%; 
            border-radius: 8px; 
            border: 2px solid #334155; 
            z-index: 1;
            cursor: crosshair; /* Cambia il cursore per far capire che si può cliccare */
        }
        .dashboard-rotta {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dato-rotta {
            font-size: 1.5rem;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Mappa & Rotte 🌍</h1>
    <div class="subtitle">Plotter Cartografico e Calcolo Distanze</div>

    <!-- Pannello di controllo superiore -->
    <div class="dashboard-rotta" style="flex-wrap: wrap; gap: 10px;">
        <div style="flex: 1; min-width: 80px;">
            <span style="color: #94a3b8; font-size: 0.8rem;">Distanza</span><br>
            <span class="dato-rotta" id="distanza-totale">0.00</span> <span style="color: #38bdf8; font-size: 0.9rem;">Nm</span>
        </div>
        <div style="flex: 1; min-width: 80px;">
            <span style="color: #94a3b8; font-size: 0.8rem;">Velocità</span><br>
            <span class="dato-rotta" id="velocita-attuale" style="color: #22c55e;">0.0</span> <span style="color: #22c55e; font-size: 0.9rem;">Kn</span>
        </div>
        <div style="flex: 1; min-width: 80px;">
            <span style="color: #94a3b8; font-size: 0.8rem;">Tempo</span><br>
            <span class="dato-rotta" id="tempo-trascorso" style="color: #facc15; font-size: 1.2rem;">00:00</span>
        </div>
        <div style="display: flex; gap: 8px; width: 100%; margin-top: 10px;">
            <button class="btn-action" id="btn-naviga" style="background: #22c55e; flex: 2; padding: 12px; font-size: 1rem; font-weight: bold;" onclick="toggleNavigazione()">▶ Inizia Navigazione</button>
            <button class="btn-action" style="background: #ef4444; flex: 1; padding: 12px; font-size: 1rem;" onclick="cancellaRotta()">🗑️</button>
        </div>
    </div>

    <!-- Contenitore Mappa -->
    <div class="panel">
        <div id="mappa-container"></div>
        <p style="color: #94a3b8; font-size: 0.85rem; text-align: center; margin-top: 10px;">
            ℹ️ Clicca in sequenza sulla mappa per tracciare i waypoint.
        </p>
    </div>

    <script src="../js/mappa-module.js"></script>
</body>
</html>
