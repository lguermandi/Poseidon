<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Librerie CSS e JS di Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #0f172a; }
        
        /* Mappa 100% schermo */
        #mappa-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }

        /* Head-Up Display (HUD) */
        .hud-top {
            position: absolute; top: 15px; left: 15px; right: 15px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px); border: 1px solid #334155;
            border-radius: 12px; padding: 12px 15px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .hud-box { text-align: center; flex: 1; border-right: 1px solid #334155; }
        .hud-box:last-child { border-right: none; }
        .hud-label { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; font-weight: bold; margin-bottom: 2px; }
        .hud-value { font-size: 1.8rem; font-weight: bold; font-family: monospace; }
        
        #distanza-totale { color: #38bdf8; } /* Azzurro */
        #velocita-attuale { color: #4ade80; } /* Verde */
        #tempo-trascorso { color: #facc15; } /* Giallo */

        /* Floating Action Buttons (FAB) */
        .fab-container {
            position: absolute; bottom: 30px; right: 20px;
            display: flex; flex-direction: column; gap: 15px; z-index: 1000;
        }
        .fab-btn {
            width: 60px; height: 60px; border-radius: 50%; border: none;
            display: flex; justify-content: center; align-items: center;
            font-size: 2rem; color: white; cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            transition: transform 0.1s;
        }
        .fab-btn:active { transform: scale(0.92); }
        #btn-center { background: #3b82f6; }
        #btn-naviga { background: #22c55e; }
        #btn-naviga.active { background: #ef4444; } /* Rosso quando registra */

        /* Bottom Sheet (Pannello Salvataggio) */
        .bottom-sheet {
            position: absolute; bottom: -100%; left: 0; right: 0;
            background: #1e293b; padding: 25px 20px;
            border-radius: 20px 20px 0 0; z-index: 2000;
            transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -10px 25px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; gap: 15px;
        }
        .bottom-sheet.open { bottom: 0; }
        .sheet-title { color: white; font-size: 1.3rem; font-weight: bold; text-align: center; }
        .sheet-buttons { display: flex; gap: 15px; margin-top: 10px; }
        .sheet-btn {
            flex: 1; padding: 15px; border-radius: 12px; border: none;
            font-size: 1rem; font-weight: bold; color: white; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Mappa -->
    <div id="mappa-container"></div>

    <!-- HUD Superiore -->
    <div class="hud-top">
        <div class="hud-box">
            <div class="hud-label">Dist (Nm)</div>
            <div class="hud-value" id="distanza-totale">0.00</div>
        </div>
        <div class="hud-box">
            <div class="hud-label">SOG (Kn)</div>
            <div class="hud-value" id="velocita-attuale">0.0</div>
        </div>
        <div class="hud-box">
            <div class="hud-label">Tempo</div>
            <div class="hud-value" id="tempo-trascorso">00:00</div>
        </div>
    </div>

    <!-- Controlli Mappa (FAB) -->
    <div class="fab-container">
        <!-- Bottone Pianificazione Manuale -->
        <button class="fab-btn" id="btn-center" onclick="salvaRottaManuale()" style="background: #8b5cf6; width: 45px; height: 45px; font-size: 1.3rem; margin-left: auto; margin-bottom: 5px;">
            <i class="ph ph-floppy-disk"></i>
        </button>
        <!-- Centra Posizione -->
        <button class="fab-btn" id="btn-center" onclick="centraMappa()">
            <i class="ph ph-crosshair"></i>
        </button>
        <!-- Play / Stop GPS -->
        <button class="fab-btn" id="btn-naviga" onclick="interruttoreNavigazione()">
            <i class="ph ph-play" id="icona-naviga"></i>
        </button>
    </div>

    <!-- Pannello di Chiusura -->
    <div class="bottom-sheet" id="sheet-salvataggio">
        <div class="sheet-title">Navigazione in Pausa ⚓</div>
        <div style="color: #94a3b8; text-align: center; font-size: 0.95rem;">
            Seleziona un'azione per chiudere l'itinerario.
        </div>
        <div class="sheet-buttons">
            <button class="sheet-btn" style="background: #ef4444;" onclick="scartaRotta()">🗑️ Scarta</button>
            <button class="sheet-btn" style="background: #10b981;" onclick="confermaSalvataggio()">💾 Salva in Profilo</button>
        </div>
    </div>

    <script src="../js/mappa-module.js"></script>
    <script>
        // Logica grafica dei pulsanti
        let uiInNavigazione = false;

        function interruttoreNavigazione() {
            const btn = document.getElementById('btn-naviga');
            const icona = document.getElementById('icona-naviga');
            
            if (!uiInNavigazione) {
                // START NAV
                uiInNavigazione = true;
                btn.classList.add('active');
                icona.className = "ph ph-stop";
                window.avviaGPS(); 
            } else {
                // STOP NAV (Mostra pannello)
                uiInNavigazione = false;
                btn.classList.remove('active');
                icona.className = "ph ph-play";
                window.fermaGPS(); 
                document.getElementById('sheet-salvataggio').classList.add('open');
            }
        }

        function confermaSalvataggio() {
            document.getElementById('sheet-salvataggio').classList.remove('open');
            window.salvaRotta();
        }

        function scartaRotta() {
            document.getElementById('sheet-salvataggio').classList.remove('open');
            window.cancellaRotta();
        }
    </script>
</body>
</html>
