<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Estensioni specifiche per il Profilo (integrate con style.css) */
        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
            gap: 20px;
            width: 100%;
        }

        body.modulo-scrollabile>main {
            width: 100%;
            min-height: 100%;
            height: auto;
            overflow: visible;
            padding: 24px 18px calc(32px + env(safe-area-inset-bottom));
        }

        html {
            height: 100%;
            overflow: hidden;
        }

        body.modulo-scrollabile h1,
        body.modulo-scrollabile h2,
        body.modulo-scrollabile h3 {
            letter-spacing: -0.02em;
        }

        .profile-header {
            margin: 0 auto 24px;
            max-width: 1280px;
        }

        .profile-header h1 {
            margin: 0 0 6px;
            font-size: clamp(1.5rem, 2vw, 2rem);
        }

        .profile-content {
            max-width: 1280px;
            margin: 0 auto;
        }

        .profile-hero {
            display: grid;
            grid-template-columns: minmax(260px, 1.1fr) minmax(280px, 1.5fr) minmax(220px, 0.8fr);
            align-items: center;
            gap: 24px;
            padding: 24px 28px;
            margin-bottom: 24px;
        }

        .profile-identity {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
        }

        .profile-avatar {
            width: 64px;
            height: 64px;
            flex: 0 0 64px;
            background: linear-gradient(135deg, var(--accento-ciano), #2563eb);
            border-radius: 18px;
            display: grid;
            place-items: center;
            font-size: 1.8rem;
            box-shadow: 0 10px 24px rgba(14, 165, 233, 0.24);
        }

        .profile-email {
            margin: 0 0 8px;
            font-size: 1rem;
            overflow-wrap: anywhere;
        }

        .profile-stats {
            margin: 0;
        }

        .profile-hero-action {
            min-height: 48px;
        }

        .profile-grid {
            grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
            align-items: stretch;
        }

        .profile-grid > .panel {
            margin-bottom: 0;
        }

        .profile-panel-title {
            margin: 0 0 22px;
            font-size: 1rem;
        }

        .profile-panel-title::after {
            content: '';
            display: block;
            width: 34px;
            height: 3px;
            margin-top: 9px;
            border-radius: 4px;
            background: var(--accento-ciano);
        }

        .profile-data-actions {
            display: grid;
            gap: 10px;
        }

        .profile-archive {
            margin-top: 24px !important;
        }

        .profile-archive h3 {
            margin-top: 0;
        }

        @media (min-width: 900px) {
            body.modulo-scrollabile>main {
                padding: 34px 36px 48px;
            }

            #form-container {
                max-width: 620px;
                margin: 42px auto;
                padding: 32px;
            }

            .profile-grid {
                gap: 24px;
            }

            .stat-widget-container {
                gap: 16px;
            }

            .stat-widget {
                padding: 18px 14px;
            }
        }

        @media (max-width: 899px) {
            .profile-hero {
                grid-template-columns: 1fr;
                gap: 18px;
            }
        }

        @media (max-width: 620px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }

            .profile-hero {
                padding: 20px;
            }
        }

        .stat-widget-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-widget {
            background: var(--bg-profondo);
            padding: 15px;
            border-radius: 14px;
            border: 1px solid var(--bordo-soft);
            text-align: center;
        }

        .stat-widget .value {
            display: block;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accento-ciano);
        }

        .stat-widget .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--testo-secondario);
            letter-spacing: 1px;
        }

        .badge-status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            background: rgba(16, 185, 129, 0.1);
            color: var(--accento-verde);
            border: 1px solid var(--accento-verde);
        }

        .track-item {
            background: var(--bg-profondo);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid var(--accento-ciano);
            transition: transform 0.2s;
        }

        .track-item:active {
            transform: scale(0.98);
        }

        .sync-indicator {
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            color: var(--testo-secondario);
        }

        .sync-indicator.active {
            color: var(--accento-verde);
        }
    </style>
</head>

<body class="modulo-scrollabile"
    style="display: block; height: 100%; min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior-y: contain;">
    <main>
        <header class="profile-header">
            <h1 style="margin-bottom: 5px;">Area Personale</h1>
            <div id="sync-status" class="sync-indicator">
                <span class="dot"></span> Controllo sincronizzazione...
            </div>
        </header>

        <!-- STATO NON LOGGATO -->
        <div id="form-container" class="panel">
            <h2 style="font-size: 1.2rem; margin-bottom: 20px;">Accedi al Cloud Poseidon</h2>
            <form onsubmit="event.preventDefault(); effettuaAccesso();">
                <div class="input-group">
                    <label>Email Comandante</label>
                    <input type="email" id="auth-email" placeholder="esempio@mail.com" required>
                </div>
                <div class="input-group">
                    <label>Codice Segreto</label>
                    <input type="password" id="auth-password" placeholder="••••••••" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <button type="submit" class="btn-action">Accedi</button>
                    <button type="button" class="btn-action" style="background: var(--pannello);"
                        onclick="registrati()">Registrati</button>
                </div>
            </form>
            <p id="auth-status" style="text-align: center; font-size: 0.85rem; margin-top: 15px;"></p>
        </div>

        <!-- DASHBOARD UTENTE LOGGATO -->
        <div id="profilo-container" class="profile-content" style="display: none;">

            <div class="panel profile-hero">
                <div class="profile-identity">
                    <div class="profile-avatar">⚓</div>
                    <div>
                        <h2 class="profile-email" id="testo-email-utente">Comandante</h2>
                        <span class="badge-status">Profilo Verificato</span>
                    </div>
                </div>

                <div class="stat-widget-container profile-stats">
                    <div class="stat-widget">
                        <span class="value" id="stat-quiz">0</span>
                        <span class="label">Quiz</span>
                    </div>
                    <div class="stat-widget">
                        <span class="value" id="stat-logbook">0</span>
                        <span class="label">Logbook</span>
                    </div>
                </div>

                <button class="btn-action profile-hero-action" onclick="window.location.href='logbook.html'">
                    📖 Apri Giornale di Bordo
                </button>
            </div>

            <div class="profile-grid">
                <!-- Impostazioni -->
                <div class="panel">
                    <h3 class="profile-panel-title">Configurazione Bordo</h3>
                    <div class="input-group">
                        <label>Qualifica / Obiettivo</label>
                        <input type="text" id="profilo-qualifica" placeholder="es. Patente Nautica"
                            onchange="salvaDatiProfilo()">
                    </div>
                    <div class="input-group">
                        <label>Nome Imbarcazione</label>
                        <input type="text" id="profilo-barca" placeholder="es. Black Pearl"
                            onchange="salvaDatiProfilo()">
                    </div>
                    <p id="stato-profilo" style="font-size: 0.75rem; color: var(--testo-secondario);"></p>
                </div>

                <!-- Backup e Dati -->
                <div class="panel">
                    <h3 class="profile-panel-title">Gestione Dati</h3>
                    <div class="profile-data-actions">
                        <button class="btn-action" style="background: #3b82f6;" onclick="esportaBackupCompleto()">💾
                            Esporta Backup .JSON</button>
                        <button class="btn-action"
                            style="background: var(--bg-profondo); border: 1px solid var(--bordo-soft);"
                            onclick="document.getElementById('file-import-completo').click()">📥 Importa Backup</button>
                        <input type="file" id="file-import-completo" style="display:none"
                            onchange="importaBackupCompleto(event)">
                        <button class="btn-action" style="background: var(--accento-rosso); margin-top: 10px;"
                            onclick="esciAccount()">Disconnetti</button>
                    </div>
                </div>
            </div>

            <!-- Archivio Rotte -->
            <div class="panel profile-archive">
                <h3>Archivio GPS (GPX)</h3>
                <div id="lista-tracce">
                    <!-- Dinamico -->
                </div>
            </div>
        </div>
    </main>

    <script src="../js/profilo-module.js"></script>
</body>

</html>
