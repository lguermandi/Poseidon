<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .problema-box { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #38bdf8; }
        .soluzione-box { background: #064e3b; padding: 20px; border-radius: 8px; border-left: 4px solid #4ade80; }
        .dato { font-size: 1.2rem; font-weight: bold; color: #f8fafc; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <h1>Modulo Carteggio 📐</h1>
    <div class="subtitle">Generatore Esercizi (Corrente e Scarroccio)</div>

    <div class="panel" style="text-align: center;">
        <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 15px;">
            Genera un problema casuale, risolvilo sulla carta nautica 5D e poi controlla se la tua somma vettoriale è corretta.
        </p>
        <button class="btn-action" onclick="generaProblema()">🎲 Genera Nuovo Problema</button>
    </div>

    <div class="panel hidden" id="pannello-problema">
        <h3 style="color: #38bdf8;">Testo dell'Esercizio</h3>
        <div class="problema-box" id="testo-problema"></div>
        
        <div style="text-align: center; margin-top: 15px;">
            <button class="btn-action" style="background: #f59e0b;" onclick="mostraSoluzione()">Mostra Soluzione Corretta</button>
        </div>
    </div>

    <div class="panel hidden" id="pannello-soluzione">
        <h3 style="color: #4ade80;">Soluzione Vettoriale</h3>
        <div class="soluzione-box" id="testo-soluzione"></div>
    </div>

    <script>
        let pv, vp, lsc, dc, vc;

        function generaProblema() {
            // 1. Genera dati casuali ma realistici per la Poseidon
            pv = Math.floor(Math.random() * 360); // Prora Vera (0-359)
            vp = (Math.random() * (8 - 4) + 4).toFixed(1); // Velocità Propulsiva (4.0 - 8.0 kn)
            
            // Scarroccio (+/- 15 gradi max)
            lsc = Math.floor(Math.random() * 31) - 15; 
            
            // Dati Corrente
            dc = Math.floor(Math.random() * 360); // Direzione Corrente
            vc = (Math.random() * (3 - 0.5) + 0.5).toFixed(1); // Velocità Corrente (0.5 - 3.0 kn)

            const testo = `
                Una imbarcazione naviga con Prora Vera (Pv) = <span class="dato">${pv}°</span> 
                e Velocità Propulsiva (Vp) = <span class="dato">${vp} kn</span>.<br><br>
                In zona soffia un vento che determina un angolo di Scarroccio (Lsc) = <span class="dato">${lsc > 0 ? '+'+lsc : lsc}°</span>.<br>
                Inoltre, è nota una corrente con Direzione (Dc) = <span class="dato">${dc}°</span> 
                e Velocità (Vc) = <span class="dato">${vc} kn</span>.<br><br>
                <strong>Calcolare la Rotta Vera (Rv) e la Velocità Effettiva (Veff).</strong>
            `;
            
            document.getElementById('testo-problema').innerHTML = testo;
            document.getElementById('pannello-problema').classList.remove('hidden');
            document.getElementById('pannello-soluzione').classList.add('hidden');
        }

        function mostraSoluzione() {
            // 1. Calcolo Rotta Vera in Superficie (Rvs)
            let rvs = pv + lsc;
            if (rvs >= 360) rvs -= 360;
            if (rvs < 0) rvs += 360;

            // 2. Scomposizione Vettoriale (Trigonometria pura per massima precisione)
            // Convertiamo i gradi in radianti per le funzioni Math.sin e Math.cos
            const radRvs = rvs * (Math.PI / 180);
            const radDc = dc * (Math.PI / 180);

            // Troviamo le coordinate Nord/Est del vettore Vp
            const vpN = vp * Math.cos(radRvs);
            const vpE = vp * Math.sin(radRvs);
            
            // Troviamo le coordinate Nord/Est del vettore Corrente
            const vcN = vc * Math.cos(radDc);
            const vcE = vc * Math.sin(radDc);

            // Sommiamo le componenti per ottenere il vettore Effettivo
            const veffN = vpN + vcN;
            const veffE = vpE + vcE;

            // Teorema di Pitagora per la lunghezza (Velocità Effettiva)
            const veff = Math.sqrt(Math.pow(veffN, 2) + Math.pow(veffE, 2)).toFixed(2);

            // Arcotangente per trovare l'angolo (Rotta Vera)
            let rv = Math.atan2(veffE, veffN) * (180 / Math.PI);
            if (rv < 0) rv += 360;
            rv = Math.round(rv);

            const parziale = `1) Rvs = Pv + (±Lsc) = ${pv}° + (${lsc > 0 ? '+'+lsc : lsc}°) = ${rvs}°`;
            
            const soluzione = `
                <div style="margin-bottom: 15px; color: #a7f3d0;">${parziale}</div>
                • Rotta Vera (Rv): <span class="dato">${rv}°</span><br>
                • Velocità Effettiva (Veff): <span class="dato">${veff} kn</span><br>
            `;

            document.getElementById('testo-soluzione').innerHTML = soluzione;
            document.getElementById('pannello-soluzione').classList.remove('hidden');
        }
    </script>
</body>
</html>
