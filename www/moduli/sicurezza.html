<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .safety-hero {
            background: linear-gradient(135deg, #7f1d1d, #991b1b);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid #f87171;
        }

        .safety-hero h1 {
            margin-bottom: 8px;
        }

        .safety-hero p {
            margin: 0;
            color: #fee2e2;
        }

        .safety-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .safety-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
        }

        .safety-card h3 {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            margin-bottom: 12px;
        }

        .safety-card h3 i {
            color: #38bdf8;
            font-size: 1.35rem;
        }

        .checklist {
            display: grid;
            gap: 9px;
        }

        .check-item {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            color: #e2e8f0;
            font-size: .9rem;
            cursor: pointer;
        }

        .check-item input {
            width: 18px;
            height: 18px;
            padding: 0;
            accent-color: #10b981;
            flex: 0 0 auto;
        }

        .check-item.done {
            color: #86efac;
            text-decoration: line-through;
        }

        .progress-bar {
            height: 8px;
            background: #0f172a;
            border-radius: 99px;
            overflow: hidden;
            margin-top: 13px;
        }

        .progress-bar span {
            display: block;
            height: 100%;
            width: 0;
            background: #10b981;
            transition: width .2s ease;
        }

        .safety-buttons {
            display: grid;
            gap: 10px;
        }

        .btn-emergency {
            background: #dc2626;
            min-height: 58px;
            font-size: 1rem;
        }

        .btn-location {
            background: #0ea5e9;
        }

        .status-sicurezza {
            min-height: 1.3em;
            color: #94a3b8;
            font-size: .85rem;
            margin: 12px 0 0;
        }

        .position-box {
            background: #0f172a;
            border-radius: 8px;
            padding: 10px;
            color: #cbd5e1;
            font: .8rem monospace;
            word-break: break-word;
        }

        @media (max-width: 600px) {
            .safety-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="safety-hero">
        <h1>Centro Sicurezza <i class="ph ph-shield-warning"></i></h1>
        <p>Controlli rapidi prima della partenza e strumenti per le emergenze.</p>
    </div>

    <div class="safety-grid">
        <section class="safety-card">
            <h3><i class="ph ph-list-checks"></i> Checklist pre-partenza</h3>
            <div class="checklist" id="checklist"></div>
            <div class="progress-bar"><span id="check-progress"></span></div>
            <p class="status-sicurezza" id="check-status"></p>
        </section>

        <section class="safety-card">
            <h3><i class="ph ph-warning-octagon"></i> Emergenza</h3>
            <div class="safety-buttons">
                <button class="btn-action btn-emergency" onclick="attivaUomoInMare()">🚨 Uomo a mare</button>
                <button class="btn-action btn-location" onclick="condividiPosizione()">📍 Condividi posizione</button>
                <a class="btn-action" style="background:#475569; text-decoration:none;" href="ancora.html">⚓ Apri
                    allarme ancora</a>
            </div>
            <p class="status-sicurezza" id="emergency-status" aria-live="polite"></p>
            <div class="position-box" id="ultima-posizione">Posizione non ancora rilevata.</div>
        </section>
    </div>

    <script>
        const CHECKLIST_KEY = 'poseidon_checklist_sicurezza';
        const checklistItems = [
            'Batteria, carburante e luci di navigazione verificati',
            'Giubbotti di salvataggio disponibili per tutti',
            'VHF acceso e canale 16 disponibile',
            'Meteo, vento, maree e rotta controllati',
            'Documenti, dotazioni e kit di primo soccorso a bordo',
            'Persona a terra informata di rotta e orario previsto'
        ];

        function leggiChecklist() {
            try { return JSON.parse(localStorage.getItem(CHECKLIST_KEY) || '[]'); } catch { return []; }
        }

        function renderChecklist() {
            const completati = leggiChecklist();
            document.getElementById('checklist').innerHTML = checklistItems.map((testo, indice) => `
                <label class="check-item ${completati.includes(indice) ? 'done' : ''}">
                    <input type="checkbox" ${completati.includes(indice) ? 'checked' : ''} onchange="aggiornaChecklist(${indice}, this.checked)">
                    <span>${testo}</span>
                </label>`).join('');
            const percentuale = Math.round((completati.length / checklistItems.length) * 100);
            document.getElementById('check-progress').style.width = `${percentuale}%`;
            document.getElementById('check-status').textContent = `${completati.length} di ${checklistItems.length} controlli completati`;
        }

        function aggiornaChecklist(indice, selezionato) {
            let completati = leggiChecklist().filter(item => item !== indice);
            if (selezionato) completati.push(indice);
            localStorage.setItem(CHECKLIST_KEY, JSON.stringify(completati.sort((a, b) => a - b)));
            renderChecklist();
        }

        function rilevaPosizione() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) return reject(new Error('GPS non disponibile'));
                navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 12000, maximumAge: 5000 });
            });
        }

        function formattaPosizione(posizione) {
            const lat = posizione.coords.latitude.toFixed(6);
            const lon = posizione.coords.longitude.toFixed(6);
            const testo = `Lat ${lat}, Lon ${lon}`;
            localStorage.setItem('poseidon_ultima_posizione_sicurezza', JSON.stringify({ lat, lon, testo, utc: new Date().toISOString() }));
            document.getElementById('ultima-posizione').textContent = testo;
            return { lat, lon, testo, link: `https://maps.google.com/?q=${lat},${lon}` };
        }

        async function attivaUomoInMare() {
            const stato = document.getElementById('emergency-status');
            if (!confirm('Attivare Uomo a mare? Recupera subito la persona e chiama i soccorsi se necessario.')) return;
            stato.textContent = 'Acquisizione posizione MOB...';
            try {
                const posizione = formattaPosizione(await rilevaPosizione());
                const messaggio = `UOMO A MARE - Posizione: ${posizione.testo} - ${posizione.link}`;
                localStorage.setItem('poseidon_mob_attivo', JSON.stringify({ ...posizione, attivatoUTC: new Date().toISOString() }));
                await inviaNotifica('🚨 UOMO A MARE', messaggio);
                await condividiTesto('EMERGENZA UOMO A MARE', messaggio);
                stato.textContent = 'MOB attivo: posizione salvata e pronta da condividere.';
            } catch (errore) {
                stato.textContent = 'GPS non disponibile: chiama i soccorsi e indica manualmente la posizione.';
            }
        }

        async function condividiPosizione() {
            const stato = document.getElementById('emergency-status');
            try {
                const posizione = formattaPosizione(await rilevaPosizione());
                await condividiTesto('Posizione Poseidon', `La mia posizione: ${posizione.testo} - ${posizione.link}`);
                stato.textContent = 'Posizione pronta per la condivisione.';
            } catch {
                stato.textContent = 'Impossibile rilevare la posizione GPS.';
            }
        }

        async function condividiTesto(titolo, testo) {
            if (navigator.share) return navigator.share({ title: titolo, text: testo });
            await navigator.clipboard?.writeText(testo);
            alert(`${testo}\n\nLa posizione è stata copiata negli appunti.`);
        }

        async function inviaNotifica(titolo, corpo) {
            const plugin = window.Capacitor?.Plugins?.LocalNotifications;
            if (!plugin) return;
            try {
                const permessi = await plugin.checkPermissions();
                if (permessi.display !== 'granted') await plugin.requestPermissions();
                await plugin.schedule({ notifications: [{ id: Date.now() % 2147483647, title: titolo, body: corpo, schedule: { at: new Date(Date.now() + 300) } }] });
            } catch (errore) { console.warn('Notifica emergenza non disponibile', errore); }
        }

        const posizioneSalvata = JSON.parse(localStorage.getItem('poseidon_ultima_posizione_sicurezza') || 'null');
        if (posizioneSalvata) document.getElementById('ultima-posizione').textContent = `${posizioneSalvata.testo} (${new Date(posizioneSalvata.utc).toLocaleString('it-IT')})`;
        renderChecklist();
    </script>
</body>

</html>
