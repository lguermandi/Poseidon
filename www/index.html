<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plancia di Comando Nautica</title>
    
    <!-- Colleghiamo il CSS e il file di Configurazione -->
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- INIZIO CODICE PWA (App Offline) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3143/3143621.png">
    <!-- FINE CODICE PWA -->
</head>
<body>

    <header id="main-header">
        <div class="logo">⛵ Poseidon</div>
        <nav id="menu-Navigazione">
            <!-- Pulsante 1: Accademia (Impostato come attivo all'avvio) -->
            <button onclick="cambiaModulo('moduli/accademia.html', this)" class="nav-btn active">
                <i class="ph ph-graduation-cap"></i>
                <span>Accademia</span>
            </button>
            
            <!-- Pulsante 2: Navigazione -->
            <button onclick="cambiaModulo('moduli/navigazione.html', this)" class="nav-btn">
                <i class="ph ph-compass"></i>
                <span>Navigazione</span>
            </button>
            
            <!-- Pulsante 3: Profilo -->
            <button onclick="cambiaModulo('moduli/profilo.html', this)" class="nav-btn">
                <i class="ph ph-user"></i>
                <span>Profilo</span>
            </button>
        </nav>
    </header>

    <main>
        <!-- L'iframe è lo "schermo" dove vengono proiettati i vari moduli -->
        <iframe id="app-frame" src="moduli/accademia.html"></iframe>
    </main>

<script defer src="js/app-shell.js"></script>

<script>
    function cambiaModulo(url, elementoBtn) {
        // Cambia la pagina proiettata nell'iframe
        document.getElementById('app-frame').src = url;
        
        // Spegne tutti i pulsanti (rimuove il colore azzurro)
        const bottoni = document.querySelectorAll('.nav-btn');
        bottoni.forEach(btn => btn.classList.remove('active'));
        
        // Accende di azzurro solo il bottone che hai appena cliccato
        elementoBtn.classList.add('active');
    }
</script>

</body>
</html>
